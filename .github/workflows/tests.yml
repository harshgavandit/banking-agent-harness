name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Create isolated test environment
        shell: python
        run: |
          import os
          import pathlib
          import venv
          venv.create('.venv', with_pip=True)
          executable_dir = pathlib.Path('.venv', 'Scripts' if os.name == 'nt' else 'bin').resolve()
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as path_file:
              path_file.write(str(executable_dir) + '\n')
      - name: Install verified dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run offline regression tests
        run: python -m pytest -q
      - name: Check Python syntax
        run: python -m compileall -q app scripts tests index.py
      - name: Check public UI JavaScript
        run: node --check web/app.js
